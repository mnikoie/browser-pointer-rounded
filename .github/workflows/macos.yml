name: Validate and package macOS installer
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release to upload the macOS installers to
        required: true
        default: v1.2.3
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Validate generated assets and shell scripts on macOS
        run: |
          python tools/validate_macos.py
          plutil -lint macOS/Browser-Pointer-Rounded.cape
          bash -n macOS/Install.command
          bash -n macOS/Restore.command
          bash -n tools/package_macos.sh
      - name: Build native installer and disk image
        run: bash tools/package_macos.sh
      - name: Upload installer files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.pkg dist/*.dmg --clobber
